# @zoytown/dsh-token bundle patch: insert this plugin's row into the profile
# roster. One row mounts both halves — the browser half is driven by the
# `dsh.client` declaration in package.json, not by a second row.
#
# Install:
#   npx -y @deepseek-ai/dsh plugin --profile web add @zoytown/dsh-token
- insert:
    - id: dsh-token
      name: '@zoytown/dsh-token'
      config:
        extraSessionRoots: []
        includeCompaction: true
        refreshIntervalMs: 30000
        indexChunkYieldMs: 16
